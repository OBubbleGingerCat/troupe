[package]
name = "troupe-diagnostics-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "=1.53.1", features = ["sync"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[package]
name = "troupe-diagnostics-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "=1.12.1"
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
futures = "=0.3.33"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
num-bigint = { version = "=0.5.1" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
troupe-diagnostics-core = { path = "../troupe-diagnostics-core" }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[package]
name = "troupe"
version = "0.1.0"
edition = "2024"

[lib]
name = "_runtime"
crate-type = ["cdylib"]

[features]
default = []
agent-test-support = []

[dependencies]
agent-client-protocol = { version = "=2.0.0" }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
pyo3 = { version = "0.29.0", features = ["abi3-py310", "experimental-async"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
uuid = { version = "1", features = ["v4"] }

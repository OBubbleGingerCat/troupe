[workspace]
members = ["crates/troupe-agent-runtime"]
resolver = "3"

[package]
name = "troupe"
version = "0.1.0"
edition = "2024"

[lib]
name = "_runtime"
crate-type = ["cdylib"]

[features]
default = []
agent-test-support = ["troupe-agent-runtime/agent-test-support"]

[dependencies]
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29.0", features = ["abi3-py310", "experimental-async"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
troupe-agent-runtime = { path = "crates/troupe-agent-runtime" }
uuid = { version = "1", features = ["v4"] }
